name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs that need more (e.g. packages: write) opt in per-job.
permissions:
  contents: read

jobs:
  downloader:
    name: Downloader (Go)
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    defaults:
      run:
        working-directory: cmd
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/go.mod
          cache-dependency-path: cmd/go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Test with coverage threshold
        run: bash scripts/test-coverage.sh
      - name: Install live downloader engines
        run: sudo apt-get update && sudo apt-get install -y aria2 qbittorrent-nox
        working-directory: .
      - name: Verify live downloads
        run: LIVE_DOWNLOAD_VERIFY=1 go test ./pkg/downloaders -run 'TestLive(DownloadThreeSourceTypes|QBittorrentDownloadTorrentURL)' -count=1 -v

  static:
    name: Static checks
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/go.mod
          cache-dependency-path: cmd/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm lint:http
      - run: pnpm lint:spec
      - run: pnpm typecheck
      - run: pnpm openapi:client:check

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project unit --shard=${{ matrix.shard }}/2 --coverage --coverage.reportsDirectory=coverage/unit-${{ matrix.shard }}
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage/unit-${{ matrix.shard }}/coverage-final.json
          flags: unit
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true

  integration:
    name: Integration tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project integration --shard=${{ matrix.shard }}/2 --coverage --coverage.reportsDirectory=coverage/integration-${{ matrix.shard }}
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage/integration-${{ matrix.shard }}/coverage-final.json
          flags: integration
          disable_search: true
          fail_ci_if_error: false
          handle_no_reports_found: true

  cloudflare:
    name: Cloudflare tests
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p dist
      - run: pnpm test:cf

  # Preserve the stable check name while every expensive gate runs independently.
  # The final dependency list below also includes the jobs declared later.
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    if: ${{ always() && github.repository == 'saltbo/zpan' }}
    needs:
      - downloader
      - static
      - unit
      - integration
      - cloudflare
      - docker-smoke
      - cf-deploy-dry-run
      - e2e-node
      - e2e-cf
    steps:
      - name: Verify every required job passed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: test "$(jq -r '[.[].result] | all(. == "success")' <<<"$JOB_RESULTS")" = true

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: zpan-zpan:latest
          cache-from: type=gha,scope=docker-server
          cache-to: type=gha,mode=max,scope=docker-server
      # Downloader engines and protocol behavior have their own live local job.
      # This smoke gate only needs to prove the current production server image boots.
      - name: Start server image
        run: docker compose -f docker-compose.yml up -d --no-build --wait --wait-timeout 60 zpan
      - name: Assert server health from host
        run: curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8222/api/health
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  docker-dev:
    name: Docker dev image
    runs-on: ubuntu-latest
    needs: [check, docker-smoke]
    # Publish the bleeding-edge `:dev` image only for green pushes to main on the
    # canonical repo — never on PRs or forks. `:latest` stays pinned to releases.
    if: github.repository == 'saltbo/zpan' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Dev images are amd64-only to skip slow arm64 QEMU emulation
          # (native better-sqlite3/sharp). Releases stay multi-arch.
          platforms: linux/amd64
          build-args: |
            APP_VERSION=dev
            APP_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:dev
          cache-from: type=gha,scope=docker-server
          cache-to: type=gha,mode=max,scope=docker-server

      - name: Build & push CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: cli
          push: true
          # Dev images are amd64-only (see server image above). Releases stay multi-arch.
          platforms: linux/amd64
          build-args: |
            APP_VERSION=dev
            APP_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:dev-cli
          cache-from: type=gha,scope=docker-cli
          cache-to: type=gha,mode=max,scope=docker-cli

  cf-deploy-dry-run:
    name: CF deploy dry-run
    runs-on: ubuntu-latest
    if: github.repository == 'saltbo/zpan'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          ZPAN_APP_VERSION: ci-dry-run
        run: pnpm build
      # --dry-run compiles the Worker and validates wrangler.toml + the
      # vite-plugin deploy config (assets dir, queues, bindings) without
      # contacting Cloudflare, so it needs no secrets and runs on fork PRs.
      # Guards the deploy regressions a unit test can't: a dropped build step
      # (#417) or an unprovisioned binding added to wrangler.toml.
      - name: Validate Cloudflare deploy config
        run: pnpm exec wrangler deploy --dry-run

  e2e-node:
    name: E2E (Node ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run E2E
        run: pnpm e2e --project=desktop --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-cf:
    name: E2E critical journeys (CF Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run E2E
        run: E2E_RUNTIME=cf pnpm e2e --project=desktop --grep @critical
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-cf
          path: |
            playwright-report/
            test-results/
          retention-days: 7
