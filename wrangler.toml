name = "zpan"
main = "./workers/bootstrap.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api",
  "/api/*",
  "/.well-known/oauth-authorization-server/*",
  "/.well-known/openid-configuration/*",
  "/.well-known/oauth-protected-resource/*",
  "/.well-known/zpan-domain-verification/*",
  "/dav",
  "/dav/*",
  "/ih/*",
  "/r/*",
  "/s/*",
]

[[d1_databases]]
binding = "DB"
database_name = "zpan-db"
database_id = "5bd64957-fa49-4da0-8b7b-6e0ad84037e7"
migrations_dir = "./migrations"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "2721f9d7b47d433d8a0e02171e276f57"

[[ratelimits]]
name = "WEBDAV_RATE_LIMITER"
namespace_id = "2801"

[ratelimits.simple]
limit = 3600
period = 60

[vars]
ZPAN_CLOUD_URL = "https://cloud.zpan.space"
ZPAN_CACHE_MODE = "distributed"

[[send_email]]
name = "EMAIL"

[[queues.producers]]
binding = "ARCHIVE_QUEUE"
queue = "zpan-archive-jobs"

[[queues.consumers]]
queue = "zpan-archive-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

# Self-hosted avatar storage. When present, avatars upload straight to R2 (served from
# /api/avatar-blobs, or from PUBLIC_IMAGES_URL if an R2 custom domain is configured)
# instead of the ZPan Cloud avatar service.
[[r2_buckets]]
binding = "PUBLIC_IMAGES"
bucket_name = "zpan-public-images"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[triggers]
crons = ["*/10 * * * *", "10 * * * *", "0 */6 * * *", "0 */12 * * *", "0 0 1 * *", "0 4 * * *"]

# Branch Previews share staging data; they never bind production resources.
[previews]

[previews.vars]
ZPAN_PREVIEW = "true"
ZPAN_ARCHIVE_JOBS_ENABLED = "false"
ZPAN_CLOUD_URL = "https://staging-zpan-cloud.saltbo.workers.dev"
ZPAN_CACHE_MODE = "memory"

[[previews.d1_databases]]
binding = "DB"
database_name = "zpan-db-staging"
database_id = "a9197d7a-6524-42f0-b646-e714dcb30b3b"
migrations_dir = "./migrations"

[[previews.kv_namespaces]]
binding = "CACHE_KV"
id = "7d8625bacbc54e23a46ca4464a9f64a0"

[[previews.ratelimits]]
name = "WEBDAV_RATE_LIMITER"
namespace_id = "2802"

[previews.ratelimits.simple]
limit = 3600
period = 60

[[previews.r2_buckets]]
binding = "PUBLIC_IMAGES"
bucket_name = "zpan-public-images-staging"

[[previews.send_email]]
name = "EMAIL"


# Used only by local development and local D1 tools.
[env.local]

[env.local.vars]
ZPAN_CLOUD_URL = "https://staging-zpan-cloud.saltbo.workers.dev"
ZPAN_CACHE_MODE = "distributed"

[[env.local.d1_databases]]
binding = "DB"
database_name = "zpan-db-staging"
database_id = "a9197d7a-6524-42f0-b646-e714dcb30b3b"
migrations_dir = "./migrations"

[[env.local.kv_namespaces]]
binding = "CACHE_KV"
id = "7d8625bacbc54e23a46ca4464a9f64a0"

[[env.local.ratelimits]]
name = "WEBDAV_RATE_LIMITER"
namespace_id = "2802"

[env.local.ratelimits.simple]
limit = 3600
period = 60

[[env.local.r2_buckets]]
binding = "PUBLIC_IMAGES"
bucket_name = "zpan-public-images-staging"

[[env.local.send_email]]
name = "EMAIL"
